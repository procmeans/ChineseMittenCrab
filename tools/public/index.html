<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growing Inc.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 128px;
      height: 128px;
      margin-bottom: 1.5rem;
      animation: fadeIn 0.8s ease-out;
    }
    .title {
      font-size: 1.5rem;
      color: #333;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Growing Inc. Logo" class="logo">
    <h1 class="title">Growing Inc.</h1>
  </div>
</body>
</html>
